{
    "jobs" : [{
            "name" : "post-fs-data",
            "cmds" : [
                "mkdir /data/service/el1/public/wifi 0770 wifi wifi",
                "mkdir /data/service/el1/public/wifi/sockets 0770 wifi wifi",
                "mkdir /data/service/el1/public/wifi/sockets/wpa 0770 wifi wifi",
                "mkdir /data/service/el1/public/wifi/wpa_supplicant 0770 wifi wifi",
                "exec /system/bin/sh -c \"[ -f /data/service/el1/public/wifi/wpa_supplicant/wpa_supplicant.conf ] || printf 'ctrl_interface=DIR=/data/service/el1/public/wifi/sockets/wpa GROUP=wifi\\nupdate_config=1\\n' > /data/service/el1/public/wifi/wpa_supplicant/wpa_supplicant.conf\"",
                "chown wifi wifi /data/service/el1/public/wifi/wpa_supplicant/wpa_supplicant.conf",
                "chmod 0660 /data/service/el1/public/wifi/wpa_supplicant/wpa_supplicant.conf"
            ]
        }
    ],
    "services" : [{
            "name" : "wpa_supplicant",
            "path" : ["/vendor/bin/wpa_supplicant",
                      "-i", "wlan0",
                      "-D", "nl80211",
                      "-c", "/data/service/el1/public/wifi/wpa_supplicant/wpa_supplicant.conf"],
            "uid" : "wifi",
            "gid" : ["wifi"],
            "caps" : ["NET_ADMIN", "NET_RAW"],
            "start-mode" : "condition",
            "disabled" : 1
        }
    ]
}
