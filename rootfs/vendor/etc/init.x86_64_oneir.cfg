{
  "jobs": [
    {
      "name": "pre-init",
      "cmds": [
        "mkdir /data/service/el0/access_token 0750 root access_token",
        "load_access_token_id ",
        "mkdir /dev/cpuset",
        "mount cgroup none /dev/cpuset cpuset",
        "mkdir /dev/cpuctl",
        "mount cgroup none /dev/cpuctl cpu",
        "mkdir /dev/memcg",
        "mount cgroup none /dev/memcg memory"
      ]
    },
    {
      "name": "post-fs-data",
      "cmds": [
        "mkdir /data/service/el1/public/wifi 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/sockets 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/sockets/wpa 0770 wifi wifi",
        "mkdir /data/service/el1/public/wifi/wpa_supplicant 0770 wifi wifi",
        "mkdir /data/service/el1/public/startup 0755 root root",
        "mkdir /data/service/el1/public/startup/parameters 0755 root root",
        "mkdir /data/service/el1/public/eth 0750 net_manager net_manager",
        "exec /system/bin/cp -n /vendor/etc/wifi/wpa_supplicant.conf /data/service/el1/public/wifi/wpa_supplicant/wpa_supplicant.conf",
        "chown wifi wifi /data/service/el1/public/wifi/wpa_supplicant/wpa_supplicant.conf",
        "chmod 0660 /data/service/el1/public/wifi/wpa_supplicant/wpa_supplicant.conf",
        "load_private_persist_params "
      ]
    },
    {
      "name": "boot && param:persist.oneir.developermode=true",
      "condition": "boot && persist.oneir.developermode=true",
      "cmds": [
        "setparam const.security.developermode.state true",
        "start hdcd"
      ]
    },
    {
      "name": "init",
      "cmds": [
        "write /dev/cpuset/cgroup.clone_children 1",
        "mkdir /dev/cpuset/foreground",
        "mkdir /dev/cpuset/background",
        "mkdir /dev/cpuset/top-app",
        "mkdir /dev/cpuset/system-background",
        "chown system system /dev/cpuset",
        "chown system system /dev/cpuset/tasks",
        "chown system system /dev/cpuset/cgroup.procs",
        "chown system system /dev/cpuset/system-background/tasks",
        "chown system system /dev/cpuset/system-background/cgroup.procs",
        "chmod 0664 /dev/cpuset/tasks",
        "chmod 0664 /dev/cpuset/cgroup.procs",
        "chmod 0664 /dev/cpuset/system-background/tasks",
        "chmod 0664 /dev/cpuset/system-background/cgroup.procs",
        "mkdir /dev/cpuctl/foreground",
        "mkdir /dev/cpuctl/background",
        "mkdir /dev/cpuctl/top-app",
        "mkdir /dev/cpuctl/system-background",
        "chown system system /dev/cpuctl",
        "chown system system /dev/cpuctl/tasks",
        "chown system system /dev/cpuctl/cgroup.procs",
        "chmod 0664 /dev/cpuctl/tasks",
        "chmod 0664 /dev/cpuctl/cgroup.procs",
        "write /dev/cpuctl/background/cpu.shares 512",
        "mkdir /dev/memcg/perf_sensitive",
        "chown system system /dev/memcg",
        "chown system system /dev/memcg/tasks",
        "chown system system /dev/memcg/perf_sensitive/cgroup.procs",
        "chmod 0755 /dev/memcg",
        "mount tracefs tracefs /sys/kernel/tracing"
      ]
    }
  ]
}
